/* ========== BİLDİRİMLER ========== */
async function requestNotificationPermission() {
  const statusEl = document.getElementById('notifStatus');
  if (!('Notification' in window)) {
    if (statusEl) statusEl.textContent = 'Bu tarayıcı bildirimleri desteklemiyor.';
    return;
  }
  const permission = await Notification.requestPermission();
  if (permission === 'granted') {
    if (statusEl) statusEl.textContent = '✓ Bildirimler aktif';
    scheduleTaskNotifications();
    scheduleEventNotifications();
    scheduleBirthdayNotifications();
  } else {
    if (statusEl) statusEl.textContent = '✗ Bildirim izni reddedildi';
  }
}

// Reminder değerinden ms cinsinden ne kadar önce bildirim gönderileceğini hesapla
function getReminderTime(reminder, dueDate, dueTime) {
  const now = new Date();
  let notifTime = null;

  if (!dueDate) return null;

  const baseDate = new Date(dueDate + 'T00:00:00');

  switch(reminder) {
    case 'at_time':
      if (!dueTime) return null;
      notifTime = new Date(dueDate + 'T' + dueTime);
      break;
    case '5min':
      if (!dueTime) return null;
      notifTime = new Date(dueDate + 'T' + dueTime);
      notifTime.setMinutes(notifTime.getMinutes() - 5);
      break;
    case '10min':
      if (!dueTime) return null;
      notifTime = new Date(dueDate + 'T' + dueTime);
      notifTime.setMinutes(notifTime.getMinutes() - 10);
      break;
    case '30min':
      if (!dueTime) return null;
      notifTime = new Date(dueDate + 'T' + dueTime);
      notifTime.setMinutes(notifTime.getMinutes() - 30);
      break;
    case '1hour':
      if (!dueTime) return null;
      notifTime = new Date(dueDate + 'T' + dueTime);
      notifTime.setHours(notifTime.getHours() - 1);
      break;
    case 'day_9am':
      notifTime = new Date(dueDate + 'T09:00:00');
      break;
    case '1day_9am':
      notifTime = new Date(dueDate + 'T09:00:00');
      notifTime.setDate(notifTime.getDate() - 1);
      break;
    case '1week_9am':
      notifTime = new Date(dueDate + 'T09:00:00');
      notifTime.setDate(notifTime.getDate() - 7);
      break;
    default:
      return null;
  }

  if (!notifTime) return null;
  const diff = notifTime - now;
  return diff > 0 && diff < 7 * 24 * 60 * 60 * 1000 ? diff : null;
}

function sendNotification(title, body) {
  if (Notification.permission !== 'granted') return;
  new Notification(title, {
    body,
    icon: '/icon-192.png',
    badge: '/icon-192.png',
    vibrate: [200, 100, 200]
  });
}

// Aktif setTimeout id'lerini takip et (tekrar planlamayı önlemek için)
const scheduledNotifs = new Set();

function scheduleTaskNotifications() {
  if (Notification.permission !== 'granted') return;
  const tasks = getTasks();
  const todayStr = formatDateStr(new Date());

  tasks.forEach(task => {
    if (!task.reminder || task.reminder === 'none') return;
    const taskDate = task.dueDate || todayStr;
    const notifKey = `task_${task.id}_${task.reminder}`;
    if (scheduledNotifs.has(notifKey)) return;

    const diff = getReminderTime(task.reminder, taskDate, task.dueTime);
    if (diff === null) return;

    scheduledNotifs.add(notifKey);
    setTimeout(() => {
      if (!task.completedDates || !task.completedDates.includes(taskDate)) {
        sendNotification('Plano — Görev Hatırlatıcı', `"${task.title}"${task.dueTime ? ' · ' + task.dueTime : ''}`);
      }
      scheduledNotifs.delete(notifKey);
    }, diff);
  });
}

function scheduleEventNotifications() {
  if (Notification.permission !== 'granted') return;
  const events = getEvents();

  Object.entries(events).forEach(([dateStr, dayEvents]) => {
    dayEvents.forEach(ev => {
      if (!ev.reminder || ev.reminder === 'none') return;
      const notifKey = `event_${ev.id}_${ev.reminder}`;
      if (scheduledNotifs.has(notifKey)) return;

      const diff = getReminderTime(ev.reminder, dateStr, ev.start);
      if (diff === null) return;

      scheduledNotifs.add(notifKey);
      setTimeout(() => {
        sendNotification('Plano — Etkinlik Hatırlatıcı', `"${ev.title}"${ev.start ? ' · ' + ev.start : ''}`);
        scheduledNotifs.delete(notifKey);
      }, diff);
    });
  });
}

function scheduleBirthdayNotifications() {
  if (Notification.permission !== 'granted') return;
  const birthdays = getBirthdays();
  const now = new Date();
  const year = now.getFullYear();

  birthdays.forEach(b => {
    if (!b.reminder || b.reminder === 'none') return;
    const [month, day] = b.monthDay.split('-');
    // Bu yılki doğum günü
    let bdayDate = new Date(year, parseInt(month)-1, parseInt(day));
    // Geçtiyse gelecek yıla bak
    if (bdayDate < now) bdayDate = new Date(year+1, parseInt(month)-1, parseInt(day));

    const bdayStr = formatDateStr(bdayDate);
    const notifKey = `birthday_${b.id}_${b.reminder}_${bdayStr}`;
    if (scheduledNotifs.has(notifKey)) return;

    const diff = getReminderTime(b.reminder, bdayStr, null);
    if (diff === null) return;

    const age = b.birthYear ? (bdayDate.getFullYear() - parseInt(b.birthYear)) : null;
    const ageStr = age ? ` (${age} yaşında)` : '';

    scheduledNotifs.add(notifKey);
    setTimeout(() => {
      sendNotification('🎂 Doğum Günü', `${b.name}'nın doğum günü!${ageStr}`);
      scheduledNotifs.delete(notifKey);
    }, diff);
  });
}

function scheduleDailySummary() {
  if (Notification.permission !== 'granted') return;
  const settings = getSettings();
  if (!settings.dailySummaryEnabled || !settings.dailySummaryTime) return;

  const [h, m] = settings.dailySummaryTime.split(':').map(Number);
  const now = new Date();
  const summaryTime = new Date();
  summaryTime.setHours(h, m, 0, 0);

  // Eğer bugün geçtiyse yarın planla
  if (summaryTime <= now) summaryTime.setDate(summaryTime.getDate() + 1);
  const diff = summaryTime - now;

  setTimeout(() => {
    const todayStr = formatDateStr(new Date());
    const tasks = getTasks();
    const highPrio = tasks.filter(t =>
      t.priority === 'high' &&
      (t.dueDate === todayStr || !t.dueDate) &&
      !t.completedDates?.includes(todayStr)
    );
    if (highPrio.length > 0) {
      sendNotification('Plano — Günlük Özet', `Bugün ${highPrio.length} önemli görev var: ${highPrio.slice(0,3).map(t=>t.title).join(', ')}${highPrio.length>3?'...':''}`);
    }
    scheduleDailySummary(); // Ertesi gün için yeniden planla
  }, diff);
}

function updateNotifStatus() {
  const statusEl = document.getElementById('notifStatus');
  if (!statusEl) return;
  if (!('Notification' in window)) {
    statusEl.textContent = 'Bu tarayıcı bildirimleri desteklemiyor.';
  } else if (Notification.permission === 'granted') {
    statusEl.textContent = '✓ Bildirimler aktif';
  } else if (Notification.permission === 'denied') {
    statusEl.textContent = '✗ Bildirim izni reddedildi (tarayıcı ayarlarından açın)';
  } else {
    statusEl.textContent = 'Bildirimler henüz aktif değil.';
  }
}

/* ========== CONTEXT MENU ========== */
let ctxMenu = null;
function closeCtxMenu() {
  if (ctxMenu) { ctxMenu.remove(); ctxMenu = null; }
}
document.addEventListener('click', closeCtxMenu);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCtxMenu(); });

function showCtxMenu(x, y, items) {
  closeCtxMenu();
  ctxMenu = document.createElement('div');
  ctxMenu.className = 'ctx-menu';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'ctx-menu-item' + (item.danger ? ' danger' : '');
    el.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
    el.addEventListener('click', (e) => { e.stopPropagation(); closeCtxMenu(); item.action(); });
    ctxMenu.appendChild(el);
  });
  // Ekran sınırı
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = x, top = y;
  ctxMenu.style.visibility = 'hidden';
  document.body.appendChild(ctxMenu);
  const rect = ctxMenu.getBoundingClientRect();
  if (left + rect.width > vw - 8) left = vw - rect.width - 8;
  if (top + rect.height > vh - 8) top = vh - rect.height - 8;
  ctxMenu.style.left = left + 'px';
  ctxMenu.style.top = top + 'px';
  ctxMenu.style.visibility = 'visible';
}

/* ========== DUPLICATE ========== */
function duplicateTask(taskId, fromDate) {
  const tasks = getTasks();
  const orig = tasks.find(t => t.id === taskId);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = generateId();
  copy.title = orig.title;
  copy.completedDates = [];
  copy.createdAt = formatDateStr(new Date());
  if (fromDate) copy.dueDate = fromDate;
  tasks.push(copy);
  saveTasks(tasks);
  renderView();
}

function duplicateEvent(eventId, fromDate) {
  const events = getEvents();
  const dayEvs = events[fromDate] || [];
  const orig = dayEvs.find(e => e.id === eventId);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = generateId();
  copy.title = orig.title;
  if (!events[fromDate]) events[fromDate] = [];
  events[fromDate].push(copy);
  saveEvents(events);
  renderView();
}

/* ========== DRAG & DROP STATE ========== */
let dragState = null; // { type: 'task'|'event', id, fromDate, elem }

/* ========== BIND CONTEXT MENU + DRAG ON DAILY ========== */
function bindDragAndContextMenu() {
  // TASK CARDS
  document.querySelectorAll('.pcard[data-task-id]').forEach(card => {
    const taskId = card.dataset.taskId;
    const dateStr = card.dataset.date;

    // Sağ tık — context menu
    card.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, [
        { icon: '⧉', label: 'Çoğalt', action: () => duplicateTask(taskId, dateStr) },
        { icon: '✏️', label: 'Düzenle', action: () => openTaskModal(taskId) },
      ]);
    });

    // Drag başlat
    card.addEventListener('dragstart', (e) => {
      dragState = { type: 'task', id: taskId, fromDate: dateStr };
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', taskId);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
  });

  // TASK LIST drop zones (günlük)
  document.querySelectorAll('.task-list[data-drop-date]').forEach(list => {
    const toDate = list.dataset.dropDate;
    list.addEventListener('dragover', (e) => {
      if (!dragState || dragState.type !== 'task') return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      list.classList.add('drag-over');
    });
    list.addEventListener('dragleave', (e) => {
      if (!list.contains(e.relatedTarget)) list.classList.remove('drag-over');
    });
    list.addEventListener('drop', (e) => {
      e.preventDefault();
      list.classList.remove('drag-over');
      if (!dragState || dragState.type !== 'task') return;
      moveTask(dragState.id, dragState.fromDate, toDate);
      dragState = null;
    });
  });

  // DAILY EVENT CARDS (günlük paneldeki etkinlik kartları)
  document.querySelectorAll('.pcard[data-event-id]').forEach(card => {
    const eventId = card.dataset.eventId;
    const dateStr = card.dataset.date;

    card.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, [
        { icon: '⧉', label: 'Çoğalt', action: () => duplicateEvent(eventId, dateStr) },
        { icon: '✏️', label: 'Düzenle', action: () => openEventModal(eventId, dateStr) },
      ]);
    });
    card.addEventListener('dragstart', (e) => {
      dragState = { type: 'event', id: eventId, fromDate: dateStr };
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
  });

  // EVENT LIST drop zones (günlük)
  document.querySelectorAll('.event-list[data-drop-date-event]').forEach(list => {
    const toDate = list.dataset.dropDateEvent;
    list.addEventListener('dragover', (e) => {
      if (!dragState || dragState.type !== 'event') return;
      e.preventDefault();
      list.classList.add('drag-over');
    });
    list.addEventListener('dragleave', (e) => {
      if (!list.contains(e.relatedTarget)) list.classList.remove('drag-over');
    });
    list.addEventListener('drop', (e) => {
      e.preventDefault();
      list.classList.remove('drag-over');
      if (!dragState || dragState.type !== 'event') return;
      moveEvent(dragState.id, dragState.fromDate, toDate);
      dragState = null;
    });
  });

  // WEEKLY EVENT CARDS
  document.querySelectorAll('.weekly-event[data-event-id]').forEach(evEl => {
    const eventId = evEl.dataset.eventId;
    const dateStr = evEl.dataset.date;
    evEl.style.cursor = 'grab';
    evEl.setAttribute('draggable', 'true');

    evEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, [
        { icon: '⧉', label: 'Çoğalt', action: () => duplicateEvent(eventId, dateStr) },
        { icon: '✏️', label: 'Düzenle', action: () => openEventModal(eventId, dateStr) },
      ]);
    });

    evEl.addEventListener('dragstart', (e) => {
      dragState = { type: 'event', id: eventId, fromDate: dateStr };
      evEl.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.stopPropagation();
    });
    evEl.addEventListener('dragend', () => {
      evEl.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
  });

  // WEEKLY TASK CARDS
  document.querySelectorAll('.weekly-event[data-task-id]').forEach(evEl => {
    const taskId = evEl.dataset.taskId;
    const dateStr = evEl.dataset.date;
    evEl.setAttribute('draggable', 'true');

    evEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      showCtxMenu(e.clientX, e.clientY, [
        { icon: '⧉', label: 'Çoğalt', action: () => duplicateTask(taskId, dateStr) },
        { icon: '✏️', label: 'Düzenle', action: () => openTaskModal(taskId) },
      ]);
    });

    evEl.addEventListener('dragstart', (e) => {
      dragState = { type: 'task', id: taskId, fromDate: dateStr };
      evEl.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.stopPropagation();
    });
    evEl.addEventListener('dragend', () => {
      evEl.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
  });

  // WEEKLY DAY COLUMNS drop zones — Y pozisyonundan saat hesapla
  document.querySelectorAll('.weekly-day-col[data-date]').forEach(col => {
    const toDate = col.dataset.date;

    // Drop indicator çizgisi
    let dropLine = null;

    function getHourFromY(e) {
      const rect = col.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const slotHeight = 56; // her saat 56px
      const startHour = 7;
      let hour = Math.floor(y / slotHeight) + startHour;
      let mins = Math.round((y % slotHeight) / slotHeight * 60 / 15) * 15;
      if (mins >= 60) { mins = 0; hour++; }
      hour = Math.max(7, Math.min(23, hour));
      return `${String(hour).padStart(2,'0')}:${String(mins).padStart(2,'0')}`;
    }

    col.addEventListener('dragover', (e) => {
      if (!dragState) return;
      e.preventDefault();
      col.classList.add('drag-over');
      // Indicator çizgisi göster
      if (!dropLine) {
        dropLine = document.createElement('div');
        dropLine.style.cssText = 'position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:20;pointer-events:none;';
        col.style.position = 'relative';
        col.appendChild(dropLine);
      }
      const rect = col.getBoundingClientRect();
      dropLine.style.top = (e.clientY - rect.top) + 'px';
    });
    col.addEventListener('dragleave', (e) => {
      if (!col.contains(e.relatedTarget)) {
        col.classList.remove('drag-over');
        if (dropLine) { dropLine.remove(); dropLine = null; }
      }
    });
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      if (dropLine) { dropLine.remove(); dropLine = null; }
      if (!dragState) return;
      const newTime = getHourFromY(e);
      if (dragState.type === 'task') moveTask(dragState.id, dragState.fromDate, toDate, newTime);
      else if (dragState.type === 'event') moveEvent(dragState.id, dragState.fromDate, toDate, newTime);
      dragState = null;
    });
  });

  // MONTHLY CELLS context menu + drop
  document.querySelectorAll('.monthly-task-preview[data-task-id]').forEach(el => {
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const taskId = el.dataset.taskId;
      const dateStr = el.dataset.date;
      showCtxMenu(e.clientX, e.clientY, [
        { icon: '⧉', label: 'Çoğalt', action: () => duplicateTask(taskId, dateStr) },
        { icon: '✏️', label: 'Düzenle', action: () => openTaskModal(taskId) },
      ]);
    });
    el.setAttribute('draggable', 'true');
    el.addEventListener('dragstart', (e) => {
      dragState = { type: 'task', id: el.dataset.taskId, fromDate: el.dataset.date };
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.stopPropagation();
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
    });
  });

  document.querySelectorAll('.monthly-task-preview[data-event-id]').forEach(el => {
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const eventId = el.dataset.eventId;
      const dateStr = el.dataset.date;
      showCtxMenu(e.clientX, e.clientY, [
        { icon: '⧉', label: 'Çoğalt', action: () => duplicateEvent(eventId, dateStr) },
        { icon: '✏️', label: 'Düzenle', action: () => openEventModal(eventId, dateStr) },
      ]);
    });
    el.setAttribute('draggable', 'true');
    el.addEventListener('dragstart', (e) => {
      dragState = { type: 'event', id: el.dataset.eventId, fromDate: el.dataset.date };
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.stopPropagation();
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
    });
  });

  document.querySelectorAll('.monthly-cell[data-date]').forEach(cell => {
    const toDate = cell.dataset.date;
    cell.addEventListener('dragover', (e) => {
      if (!dragState) return;
      e.preventDefault();
      cell.classList.add('drag-over');
    });
    cell.addEventListener('dragleave', (e) => {
      if (!cell.contains(e.relatedTarget)) cell.classList.remove('drag-over');
    });
    cell.addEventListener('drop', (e) => {
      e.preventDefault();
      cell.classList.remove('drag-over');
      if (!dragState) return;
      if (dragState.type === 'task') moveTask(dragState.id, dragState.fromDate, toDate);
      else if (dragState.type === 'event') moveEvent(dragState.id, dragState.fromDate, toDate);
      dragState = null;
    });
  });
}

/* ========== MOVE TASK ========== */
function moveTask(taskId, fromDate, toDate, newTime) {
  const tasks = getTasks();
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  // Tekrarlayan görevlerde sadece bu tarih için kopya oluştur
  if (task.repeat && task.repeat !== 'none') {
    const copy = JSON.parse(JSON.stringify(task));
    copy.id = generateId();
    copy.repeat = 'none';
    copy.repeatConfig = { days: [] };
    copy.dueDate = toDate;
    copy.completedDates = [];
    if (newTime) copy.dueTime = newTime;
    if (!task.skipDates) task.skipDates = [];
    task.skipDates.push(fromDate);
    tasks.push(copy);
  } else {
    task.dueDate = toDate;
    if (newTime) task.dueTime = newTime;
  }
  saveTasks(tasks);
  renderView();
}

/* ========== MOVE EVENT ========== */
function moveEvent(eventId, fromDate, toDate, newTime) {
  const events = getEvents();
  const fromEvs = events[fromDate] || [];
  const idx = fromEvs.findIndex(e => e.id === eventId);
  if (idx < 0) return;
  const ev = fromEvs.splice(idx, 1)[0];
  if (fromEvs.length === 0) delete events[fromDate];
  else events[fromDate] = fromEvs;
  // Saat güncelle (haftalık drag)
  if (newTime && !ev.allDay) {
    // Süreyi koru
    const oldStartMins = ev.start ? timeToMins(ev.start) : 0;
    const oldEndMins = ev.end ? timeToMins(ev.end) : 0;
    const duration = oldEndMins - oldStartMins;
    ev.start = newTime;
    if (duration > 0) {
      const newStartMins = timeToMins(newTime);
      const newEndMins = newStartMins + duration;
      const endH = Math.floor(newEndMins / 60);
      const endM = newEndMins % 60;
      ev.end = `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
    }
  }
  if (!events[toDate]) events[toDate] = [];
  events[toDate].push(ev);
  saveEvents(events);
  renderView();
}
